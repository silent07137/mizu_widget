name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Configure Android tools
        run: bash tools/android_ci_sdk.sh
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Check and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lint assembleDebug assembleDebugAndroidTest
      - name: Upload testable APKs and lint report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mizu-widget-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/lint-results-*.html

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Configure Android tools
        run: bash tools/android_ci_sdk.sh
      - name: Install SDK and emulator
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "emulator" "system-images;android-${{ matrix.api }};google_apis;x86_64"
          echo "no" | avdmanager create avd --force --name mizu-ci --package "system-images;android-${{ matrix.api }};google_apis;x86_64"
          sudo chmod 666 /dev/kvm
      - name: Build test APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Boot and test
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd mizu-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/mizu-emulator.log 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82
          python3 tools/device_tests.py
      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-tests-api-${{ matrix.api }}
          if-no-files-found: warn
          path: test-artifacts/instrumentation.txt
